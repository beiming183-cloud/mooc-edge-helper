<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MOOC资料助手</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <h1>MOOC 资料助手</h1>
        <p>Edge 正式版 v1.1.0</p>
      </div>
      <button id="scanBtn" class="primary">扫描当前课程</button>
    </header>

    <section id="status" class="status">请先打开中国大学MOOC课程学习页，然后点击“扫描当前课程”。</section>

    <section id="filters" class="filters hidden">
      <label><input id="fPpt" type="checkbox" checked /> PPT/PPTX</label>
      <label><input id="fPdf" type="checkbox" checked /> PDF</label>
      <label><input id="fWord" type="checkbox" checked /> Word</label>
      <label><input id="fExcel" type="checkbox" checked /> Excel</label>
      <label><input id="fOther" type="checkbox" checked /> 其他附件</label>
      <label class="new-only"><input id="onlyNew" type="checkbox" /> 仅看新增</label>
    </section>

    <section id="downloadOptions" class="download-options hidden">
      <span>下载方式：</span>
      <label><input type="radio" name="downloadMode" value="files" checked /> 分别下载</label>
      <label><input type="radio" name="downloadMode" value="zip" /> 打包 ZIP</label>
      <span class="hint">ZIP 会保留课程/章节/课时目录结构</span>
    </section>

    <section id="summary" class="summary hidden"></section>
    <section id="list" class="list"></section>

    <footer>
      <button id="selectNewBtn" class="secondary" disabled>只选新增</button>
      <button id="selectAllBtn" class="secondary" disabled>全选可见</button>
      <button id="markKnownBtn" class="secondary" disabled title="将当前课程已扫描到的资料作为基线，以后只把新出现的资料标为新增">当前全部标为已有</button>
      <button id="downloadBtn" class="primary" disabled>下载选中</button>
      <button id="copyDiagBtn" class="secondary" disabled>复制诊断</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
